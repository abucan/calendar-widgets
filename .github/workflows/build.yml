name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # With the signing secrets set, every build is signed with the same key,
      # so a new APK installs over the previous one. Without them the build
      # falls back to a throwaway debug key.
      - name: Prepare signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew :core:test --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="calendar-widgets-1.0.${VERSION_CODE}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          signing="signed with the stable key"
          [ -z "$KEYSTORE_BASE64" ] && signing="signed with a temporary key (uninstall the old version before installing)"
          gh release create "v1.0.${VERSION_CODE}" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Calendar Widgets 1.0.${VERSION_CODE}" \
            --notes "Built from ${GITHUB_SHA::7}, ${signing}."
